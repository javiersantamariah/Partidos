<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partidos FCBQ</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--soft:#fff4ee;--tx:#17202b;--mu:#667284;--ac:#e25a12;--bd:#f0d9cc;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171d;--card:#1d232c;--soft:#2a211c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#3a3029;--wa:#f5b04c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171d;--card:#1d232c;--soft:#2a211c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#3a3029;--wa:#f5b04c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:1.05rem;margin:1.2rem 0 .4rem}
.hd{display:flex;align-items:center;gap:14px;margin:8px 0 14px}.ic{width:60px;height:60px;border-radius:18px;background:var(--ac);color:var(--acx,#fff);display:grid;place-items:center;box-shadow:0 6px 16px rgba(226,90,18,.3)}.tt{font-size:1.9rem;font-weight:800;line-height:1.1}
.card{background:linear-gradient(180deg,var(--card),var(--soft));border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:11px 18px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--acx,#fff);font-weight:700}
select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:5px 8px}
textarea{width:100%;min-height:120px;box-sizing:border-box;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font:14px/1.3 monospace;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.mu{color:var(--mu);font-size:.88rem}.wa{color:var(--wa);font-size:.9rem;margin:.3rem 0}
.em{text-align:center;padding:26px 10px;color:var(--ac)}.em b,.em div{color:var(--tx)}.em div.mu{color:var(--mu)}input[type=text]{width:100%;box-sizing:border-box;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px}.sw2{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid transparent}.sw2.on{border-color:var(--tx)}.lg{padding:8px 10px}.em b{display:block;font-size:1.2rem;margin-top:8px}
.bs{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 6px;text-align:center;align-items:center}.big{font-size:3.4rem;line-height:1.1}.dash{font-size:2rem;color:var(--mu)}
.tn{font-weight:700;text-transform:uppercase;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}.td{font-size:.78rem;color:var(--mu)}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 0;text-align:center}
.pc span{display:block;font-size:.78rem;color:var(--mu)}.pc b{font-size:1.25rem}.pc.cur b{color:var(--ac)}.pc i{color:var(--mu);font-style:normal;font-weight:400}
.cr,.cri{width:var(--z);height:var(--z);border-radius:22%;margin:0 auto 4px;display:block;flex:none;box-sizing:border-box}.cr{object-fit:contain;background:#fff;border:1px solid var(--bd)}.cri{display:grid;place-items:center;background:var(--ac);color:var(--acx,#fff);font-weight:800}.cr.in,.cri.in{display:inline-block;vertical-align:middle;margin:0 6px 0 0}.cri.in{text-align:center;line-height:var(--z)}.pk{cursor:pointer}
.sw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}.it{display:flex;justify-content:space-between;gap:8px;align-items:center}
summary{font-weight:700;cursor:pointer}.pr{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--soft:#fff;--tx:#000;--mu:#444;--bd:#999;--wa:#7a3b00;--ac:#d9531e;color-scheme:light}body{background:#fff}button,textarea,details,.np{display:none!important}.card{break-inside:avoid;background:#fff}main{padding:0}.pr{display:flex;align-items:center;gap:8px;background:#d9531e;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:1.1rem;margin-bottom:8px}th{background:#fde7dd}}
</style>

<script>
var KEY="fcbq_partidos_v1",games=load(),cur=null,msg="";
var cfg={ac:"#e25a12",mode:"auto",logo:"ball",title:"",size:0,lang:"es",chk:false},setv=false;
var HID=/^(No se ha leído la plantilla|La web indicaba|Período \S+: las jugadas suman|Puntos distintos a los de la web)/;
function vis(w){return cfg.chk?w:w.filter(function(x){return!HID.test(x)})}
(function(){try{var c=JSON.parse(localStorage.getItem(KEY+"_cfg")||"null");if(c)for(var k in c)cfg[k]=c[k]}catch(e){}})();
function saveCfg(){try{localStorage.setItem(KEY+"_cfg",JSON.stringify(cfg))}catch(e){}}
var LOC={es:"es-ES",en:"en-GB",ca:"ca-ES"};
function rgb(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mixw(h,w){return"rgb("+rgb(h).map(function(v){return Math.round(v+(255-v)*w)})+")"}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function applyCfg(){
  var r=document.documentElement,c=rgb(cfg.ac);
  var dark=cfg.mode==="dark"||(cfg.mode==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  if(cfg.mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",cfg.mode);
  var ac=dark?mixw(cfg.ac,.25):cfg.ac;
  r.style.setProperty("--ac",ac);r.style.setProperty("--acx",lum(cfg.ac)>.5&&!dark?"#111":(dark?"#111":"#fff"));
  r.style.setProperty("--soft","rgba("+c+",.10)");r.style.setProperty("--bd","rgba("+c+",.30)");
  r.style.fontSize=[16,18,20][cfg.size]+"px";r.lang=cfg.lang;
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=cfg.ac;
}
var LG={ball:'<circle cx="16" cy="16" r="13"/><path d="M16 3v26M3 16h26M6 6c6 5 6 15 0 20M26 6c-6 5-6 15 0 20"/>',
hoop:'<rect x="7" y="3" width="18" height="12" rx="1"/><rect x="12" y="8" width="8" height="7"/><path d="M9 15h14M11 15l2 12M16 15v12M21 15l-2 12M12 21h8"/>',
trophy:'<path d="M9 4h14v8a7 7 0 0 1-14 0zM9 7H4v2a5 5 0 0 0 5 5M23 7h5v2a5 5 0 0 1-5 5M16 19v5M11 28h10M13 24h6"/>',
whistle:'<circle cx="11" cy="20" r="7"/><path d="M16 15l12-5v6l-8 3M11 13V8"/>',
jersey:'<path d="M11 4L4 8l3 6 3-2v16h12V12l3 2 3-6-7-4c-1 3-4 3-5 3s-4 0-5-3z"/>'};
function ic(n,z){return'<svg width="'+z+'" height="'+z+'" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle" aria-hidden="true">'+(LG[n]||LG.ball)+'</svg>'}
function ball(z){return ic(cfg.logo,z)}
function setCfg(k,v){cfg[k]=k==="size"?+v:(k==="chk"?v==="1":v);saveCfg();applyCfg();render()}
function resetCfg(){cfg={ac:"#e25a12",mode:"auto",logo:"ball",title:"",size:0,lang:cfg.lang,chk:false};saveCfg();applyCfg();render()}
function openSet(){setv=true;render()}
function closeSet(){setv=false;render()}
function cbtn(l,k,v,on){return"<button class='"+(on?"p":"")+"' onclick='setCfg(\""+k+"\",\""+v+"\")'>"+l+"</button>"}
function settings(){
  var h="<div class='row np'><button onclick='closeSet()'>← Partidos</button></div><div class='tt' style='font-size:1.5rem'>Ajustes</div>";
  h+="<div class='card'><b>Idioma</b><div class='row'>"+cbtn("Castellano","lang","es",cfg.lang==="es")+cbtn("English","lang","en",cfg.lang==="en")+cbtn("Català","lang","ca",cfg.lang==="ca")+"</div></div>";
  h+="<div class='card'><b>Aspecto</b><div class='row'>"+cbtn("Automático","mode","auto",cfg.mode==="auto")+cbtn("Claro","mode","light",cfg.mode==="light")+cbtn("Oscuro","mode","dark",cfg.mode==="dark")+"</div></div>";
  h+="<div class='card'><b>Color principal</b><div class='row'>"+["#e25a12","#1f6fd1","#2e9e5b","#d63a3a","#7b4fd1","#12a6a0","#3a4350"].map(function(c){return"<button class='sw2"+(cfg.ac===c?" on":"")+"' style='background:"+c+"' onclick='setCfg(\"ac\",\""+c+"\")'></button>"}).join("")+"<input type='color' value='"+cfg.ac+"' onchange='setCfg(\"ac\",this.value)' style='width:44px;height:44px;border:0;background:none;padding:0'></div></div>";
  h+="<div class='card'><b>Símbolo del logo</b><div class='row'>"+Object.keys(LG).map(function(n){return"<button class='lg"+(cfg.logo===n?" p":"")+"' onclick='setCfg(\"logo\",\""+n+"\")'>"+ic(n,28)+"</button>"}).join("")+"</div></div>";
  h+="<div class='card'><b>Nombre de la cabecera</b><input type='text' maxlength='24' value='"+esc(cfg.title)+"' placeholder='Partidos' onchange='setCfg(\"title\",this.value)'></div>";
  h+="<div class='card'><b>Tamaño del texto</b><div class='row'>"+cbtn("Normal","size",0,cfg.size===0)+cbtn("Grande","size",1,cfg.size===1)+cbtn("Muy grande","size",2,cfg.size===2)+"</div></div>";
  h+="<div class='card'><b>Avisos de comprobación</b><div class='mu'>Avisos sobre jugadas que faltan o puntos que no cuadran con la web.</div><div class='row'>"+cbtn("Ocultar","chk","0",!cfg.chk)+cbtn("Mostrar","chk","1",cfg.chk)+"</div></div>";
  h+="<div class='card'><b>Vista previa</b><div class='bs' style='margin-top:8px'><b class='big' style='color:var(--ac)'>74</b><span class='dash'>–</span><b class='big'>5</b><div class='tn'>Equipo A</div><div class='td'></div><div class='tn'>Equipo B</div></div></div>";
  h+="<div class='row'><button onclick='resetCfg()'>Restaurar valores originales</button></div>";
  return h;
}
