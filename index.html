<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partidos FCBQ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9531e">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5d6877;--ac:#d9531e;--bd:#dde1e7;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171d;--card:#1d232c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#2f3844;--wa:#f5b04c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171d;--card:#1d232c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#2f3844;--wa:#f5b04c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:.2rem 0 .8rem}h2{font-size:1.05rem;margin:1.2rem 0 .4rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
textarea{width:100%;min-height:130px;box-sizing:border-box;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:14px/1.3 monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;align-items:center}
.sc b{font-size:2.2rem}.sc span{font-size:.95rem}.mu{color:var(--mu);font-size:.88rem}.wa{color:var(--wa);font-size:.9rem;margin:.3rem 0}
.sw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}.it{display:flex;justify-content:space-between;gap:8px;align-items:center}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#999;--wa:#7a3b00;color-scheme:light}body{background:#fff}button,textarea,details,.np{display:none!important}.card{break-inside:avoid}main{padding:0}}
.pr{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pr{display:flex;align-items:center;gap:8px;background:#d9531e;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:1.1rem;margin-bottom:8px}th{background:#fde7dd}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY="fcbq_partidos_v1",games=load(),cur=null,msg="";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(games));return true}catch(e){msg="No se pudo guardar en este navegador.";return false}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ACT=/^(Tir de [23] (anotat|fallat)|Tir lliure (anotat|fallat)|Rebot .+|Assist.+|Pèrdua|Recuperació|Tap.*|Falta.*|Entra|Surt|Temps mort.*)$/;
var PTS={"Tir de 2 anotat":"t2","Tir de 3 anotat":"t3","Tir lliure anotat":"tl"};
function parse(text){
  var t=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={teams:[],roster:{},markers:{},ev:{},claimed:null,parsed:0,date:null,abbr:[]};
  var di=t.findIndex(function(s){return/^\d{2}\/\d{2}\/\d{4}\s*·/.test(s)});
  if(di>=0){o.date=t[di];for(var i=di+1;i<t.length&&!/^P\d+$/.test(t[i])&&o.teams.length<2;i++)if(!/^\d+$/.test(t[i]))o.teams.push(t[i])}
  var mi=t.findIndex(function(s){return/^Mostrant \d+ jugades/.test(s)});
  if(mi>=0)o.claimed=+t[mi].match(/\d+/)[0];
  var ab=false,lim=mi>=0?mi:t.length;
  for(var i=0;i<lim;i++){
    if(/^[A-ZÀ-Ú]{2,5}$/.test(t[i])&&t[i+1]==="Tots"){o.abbr.push(t[i]);ab=true;continue}
    var m=ab&&t[i].match(/^(\d+)\s+(.+)$/);
    if(m)o.roster[m[2]]={team:o.abbr.length-1,dorsal:m[1]};
  }
  var st=mi>=0?mi+1:0,end=t.length;
  for(var i=st;i<t.length-1;i++)if(t[i]==="Quart"&&t[i+1]==="Tots"){end=i;break}
  var first=null;
  for(var i=st;i<end;i++){var m=t[i].match(/^Final Quart (\d+)$/);
    if(m){var n=+m[1];if(first===null)first=n;var sc=(t[i+1]||"").match(/^(\d+)\s*·\s*(\d+)$/);if(sc)o.markers[n]=[+sc[1],+sc[2]]}}
  var per=first===null?null:first+1;
  for(var i=st;i<end;i++){
    var m=t[i].match(/^Final Quart (\d+)$/);if(m){per=+m[1];continue}
    if(!ACT.test(t[i]))continue;
    o.parsed++;
    var act=t[i],name=t[i-1],kind=PTS[act];
    if(!kind){if(/^Falta/.test(act)&&!/rebuda/i.test(act))kind="f";else continue}
    if(!name||/^(\d+|P\d+|\d+:\d+)$/.test(name))continue;
    var p=per;
    if(p===null)for(var j=i+1;j<end;j++){var q=t[j].match(/^P(\d+)$/);if(q){p=+q[1];break}}
    if(p===null)continue;
    var sig=p+"|"+name+"|"+act;
    if(!o.ev[sig])o.ev[sig]={per:p,name:name,kind:kind,n:0};
    o.ev[sig].n++;
  }
  return o;
}
function merge(g,o,replace){
  if(o.teams.length===2&&(!g.teams||g.teams.length<2))g.teams=o.teams;
  if(o.date)g.date=o.date;
  if(o.abbr.length)g.abbr=o.abbr;
  for(var k in o.roster)g.roster[k]=o.roster[k];
  for(var k in o.markers)g.markers[k]=o.markers[k];
  if(replace)g.ev={};
  for(var s in o.ev){var e=o.ev[s];if(!g.ev[s])g.ev[s]={per:e.per,name:e.name,kind:e.kind,n:e.n};else g.ev[s].n=Math.max(g.ev[s].n,e.n)}
  g.claimed=o.claimed;g.parsed=o.parsed;g.updated=Date.now();
}
function calc(g){
  var r={pl:[{},{},{}],pp:[{},{},{}],tot:[0,0,0]},per={};
  for(var s in g.ev){
    var e=g.ev[s],ro=g.roster[e.name],tm=ro?ro.team:2;if(tm>1)tm=2;
    var P=r.pl[tm];if(!P[e.name])P[e.name]={t2:0,t3:0,tl:0,f:0,d:ro?ro.dorsal:"?"};
    if(e.kind==="f")P[e.name].f+=e.n;
    else{var v={t2:2,t3:3,tl:1}[e.kind]*e.n;P[e.name][e.kind]+=v;r.tot[tm]+=v;r.pp[tm][e.per]=(r.pp[tm][e.per]||0)+v;per[e.per]=1}
  }
  for(var k in g.markers)per[k]=1;
  r.per=Object.keys(per).map(Number).sort(function(a,b){return a-b});
  r.warn=[];
  r.per.forEach(function(p){var m=g.markers[p];if(!m)return;
    var a=r.pp[0][p]||0,b=r.pp[1][p]||0;
    if(a!==m[0]||b!==m[1])r.warn.push("Período "+p+": las jugadas suman "+a+"-"+b+" pero la web indica "+m[0]+"-"+m[1]+". Faltan o sobran jugadas.")});
  if(g.claimed!=null&&g.parsed!==g.claimed)r.warn.push("La web indicaba "+g.claimed+" jugadas y he leído "+g.parsed+" en la última pegada.");
  if(r.pl[2]&&Object.keys(r.pl[2]).length)r.warn.push("Hay jugadores sin equipo asignado (falta la plantilla en lo pegado).");
  return r;
}
function title(g){return g.teams&&g.teams.length===2?g.teams[0]+" - "+g.teams[1]:"Partido sin nombre"}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"}
function tbl(P){
  var ns=Object.keys(P).sort(function(a,b){var x=P[a],y=P[b];return(y.t2+y.t3+y.tl)-(x.t2+x.t3+x.tl)||a.localeCompare(b)});
  if(!ns.length)return'<p class="mu">Sin jugadas de puntos ni faltas.</p>';
  var s=[0,0,0,0,0],h='<div class="sw"><table><thead><tr><th>Jugador</th><th>T2</th><th>T3</th><th>TL</th><th>Total</th><th>Faltas</th></tr></thead><tbody>';
  ns.forEach(function(n){var x=P[n],tt=x.t2+x.t3+x.tl;s[0]+=x.t2;s[1]+=x.t3;s[2]+=x.tl;s[3]+=tt;s[4]+=x.f;
    h+="<tr><td>"+esc(x.d)+" "+esc(n)+"</td><td>"+x.t2+"</td><td>"+x.t3+"</td><td>"+x.tl+"</td><td><b>"+tt+"</b></td><td>"+x.f+"</td></tr>"});
  return h+"</tbody><tfoot><tr><td>Equipo</td><td>"+s[0]+"</td><td>"+s[1]+"</td><td>"+s[2]+"</td><td>"+s[3]+"</td><td>"+s[4]+"</td></tr></tfoot></table></div>";
}
function home(){
  var h="<h1>"+ball(26)+" Seguimiento de partidos</h1><div class='row'><button class='p' onclick='newGame()'>Nuevo partido</button></div>";
  if(!games.length)h+="<p class='mu'>Todavía no hay partidos guardados.</p>";
  games.slice().sort(function(a,b){return(b.updated||0)-(a.updated||0)}).forEach(function(g){
    h+="<div class='card it'><div><b>"+esc(g.kind==="resumen"?g.teams.join(" - "):title(g))+"</b>"+(g.kind==="resumen"?" <span class='mu'>(resumen)</span>":"")+"<div class='mu'>"+esc(g.date||"")+" · actualizado "+fmt(g.updated)+"</div></div><button onclick='openGame("+g.id+")'>Abrir</button></div>"});
  h+="<div class='card'><b>Importar resumen de una IA</b><div class='mu'>Pega el resumen completo (con tablas). Se guarda como «resumen importado».</div><textarea id='rs' placeholder='Pega aquí el resumen'></textarea><div class='row'><button onclick='impSum()'>Importar resumen</button></div></div>";
  h+="<div class='card'><b>Copia de seguridad</b><div class='mu'>Guarda este texto en Notas o envíatelo. Para recuperar, pégalo y pulsa Restaurar.</div><textarea id='bk' placeholder='Aquí aparece la copia, o pega una para restaurar'></textarea><div class='row'><button class='p' onclick='expAll()'>Copiar copia de seguridad</button><button onclick='impAll()'>Restaurar desde texto</button></div><div class='mu' id='bkm'></div></div>";
  h+="<p class='mu'>Los partidos se guardan en este navegador y este dispositivo. Si borras los datos del navegador, se pierden.</p>";
  return h;
}
function game(g){
  var r=calc(g),T=g.teams&&g.teams.length===2?g.teams:["Local","Visitante"];
  var h="<div class='pr'>"+ball(28)+" Partidos FCBQ</div><div class='row'><button onclick='goHome()'>← Partidos</button><button onclick='window.print()'>Descargar PDF</button></div><h1>"+esc(title(g))+"</h1>";
  h+="<div class='card'><div class='sc'><div><span>"+esc(T[0])+"</span><br><b>"+r.tot[0]+"</b></div><div class='mu'>puntos</div><div><span>"+esc(T[1])+"</span><br><b>"+r.tot[1]+"</b></div></div>";
  if(r.per.length){h+="<div class='sw'><table><thead><tr><th></th>"+r.per.map(function(p){return"<th>P"+p+"</th>"}).join("")+"<th>Total</th></tr></thead><tbody>";
    [0,1].forEach(function(i){h+="<tr><td>"+esc(T[i])+"</td>"+r.per.map(function(p){return"<td>"+(r.pp[i][p]||0)+"</td>"}).join("")+"<td><b>"+r.tot[i]+"</b></td></tr>"});h+="</tbody></table></div>"}
  h+="<div class='mu'>Última actualización: "+fmt(g.updated)+(g.claimed!=null?" · jugadas leídas "+g.parsed+" de "+g.claimed:"")+"</div>";
  r.warn.forEach(function(w){h+="<div class='wa'>⚠ "+esc(w)+"</div>"});h+="</div>";
  h+="<div class='card np'><b>Añadir información</b><div class='mu'>Copia toda la página del partido en la web de la federación y pégala aquí.</div><textarea id='tx' placeholder='Pega aquí el texto de la página'></textarea><div class='row'><button class='p' onclick='paste(false)'>Añadir y actualizar</button><button onclick='paste(true)'>Sustituir jugadas</button></div><div class='mu'>«Añadir» conserva lo ya guardado y no duplica. «Sustituir» borra las jugadas guardadas y usa solo esta pegada (útil si la web corrigió algo).</div></div>";
  [0,1].forEach(function(i){h+="<h2>"+esc(T[i])+"</h2>"+tbl(r.pl[i])});
  if(Object.keys(r.pl[2]).length)h+="<h2>Sin equipo asignado</h2>"+tbl(r.pl[2]);
  h+="<p class='mu'>T2: puntos de tiros de 2. T3: puntos de triples. TL: tiros libres. Las faltas cuentan las cometidas por el jugador, sin las recibidas.</p><div class='row'><button onclick='del()'>Eliminar partido</button></div>";
  return h;
}
function render(){var g=games.find(function(x){return x.id===cur});
  document.getElementById("app").innerHTML=(g?(g.kind==="resumen"?gameImp(g):game(g)):home())+(msg?"<div class='wa'>"+esc(msg)+"</div>":"");msg=""}
function newGame(){var g={id:Date.now(),teams:[],abbr:[],roster:{},markers:{},ev:{},updated:null};games.push(g);save();cur=g.id;render()}
function openGame(id){cur=id;render()}
function goHome(){cur=null;render()}
function del(){if(!confirm("¿Eliminar este partido guardado?"))return;games=games.filter(function(x){return x.id!==cur});save();cur=null;render()}
function bkm(t){var e=document.getElementById("bkm");if(e)e.textContent=t}
function expAll(){var el=document.getElementById("bk"),s=JSON.stringify({v:1,games:games});el.value=s;el.select();
  try{navigator.clipboard.writeText(s).then(function(){bkm("Copiado ("+games.length+" partidos). Pégalo en un sitio seguro.")},function(){bkm("Selecciona el texto y cópialo a mano.")})}catch(e){bkm("Selecciona el texto y cópialo a mano.")}}
function impAll(){var v=document.getElementById("bk").value,d;
  try{d=JSON.parse(v);if(!d||!Array.isArray(d.games))throw 0}catch(e){bkm("El texto no es una copia válida.");return}
  var n=0;d.games.forEach(function(g){var i=games.findIndex(function(x){return x.id===g.id});
    if(i<0){games.push(g);n++}else if((g.updated||0)>(games[i].updated||0)){games[i]=g;n++}});
  save();render();bkm("Restaurados o actualizados: "+n+" partidos.")}
function ball(n){return'<svg width="'+n+'" height="'+n+'" viewBox="0 0 32 32" style="vertical-align:middle" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8662f" stroke="#fff" stroke-width="2"/><g fill="none" stroke="#3b1608" stroke-width="1.6"><path d="M16 2v28M2 16h28"/><path d="M5.5 5.5c6 6 6 15 0 21M26.5 5.5c-6 6-6 15 0 21"/></g></svg>'}
function nz(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function tmx(x,T){x=nz(x);if(x.length<2)return-1;for(var i=0;i<2;i++){var t=nz(T[i]);if(t.indexOf(x)>=0||x.indexOf(t)>=0)return i}return-1}
function nm(x){return/^\d+$/.test(x)?+x:null}
function parseSum(text){
  var L=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={id:Date.now(),kind:"resumen",teams:["Local","Visitante"],date:null,per:{},tot:[null,null],pl:[[],[]],warn:[],src:text.slice(0,30000),updated:Date.now()};
  var tl=L.find(function(s){return/\s+vs\.?\s+/i.test(s)&&s.length<160});
  if(tl){var p=tl.replace(/^#+\s*/,"").split("—").pop().split(/\s+vs\.?\s+/i);if(p.length===2)o.teams=[p[0].trim(),p[1].trim()]}
  var dm=text.match(/(\d{2}\/\d{2}\/\d{4})/);if(dm)o.date=dm[1];
  var sec=0,ct=-1,ht=[0,1];
  L.forEach(function(l){
    var h=l.match(/^(?:#+\s*)?(\d+)\\?\.\s+[A-ZÀ-Ú ]+$/);
    if(h){sec=+h[1];ct=-1;return}
    if(l[0]!=="|"){if((sec===3||sec===5)&&l.length<60&&l.indexOf(":")<0){var t=tmx(l,o.teams);if(t>=0)ct=t}return}
    var c=l.split("|").slice(1,-1).map(function(x){return x.trim()});
    if(!c.length||/^[-: ]+$/.test(c.join("")))return;
    if(sec===2){
      if(/^periodo/i.test(c[0])){ht=[tmx(c[1]||"",o.teams),tmx(c[2]||"",o.teams)];return}
      var pm=c[0].match(/^P(\d+)/),a=nm(c[1]),b=nm(c[2]);
      if(pm&&a!==null&&b!==null)o.per[+pm[1]]=ht[0]===1?[b,a]:[a,b];
      else if(/^total/i.test(c[0])&&a!==null&&b!==null)o.tot=ht[0]===1?[b,a]:[a,b];
      return}
    if(ct<0||/^(jugador|suma|marcador|diferencia|resto)/i.test(c[0]))return;
    if(sec===3)o.pl[ct].push({n:c[0],t2:nm(c[1]),t3:nm(c[2]),tl:nm(c[3]),tot:nm(c[4]),f:null});
    else if(sec===5){var k=nz(c[0]),e=o.pl[ct].find(function(x){return nz(x.n)===k});
      if(e)e.f=nm(c[1]);else o.pl[ct].push({n:c[0],t2:null,t3:null,tl:null,tot:null,f:nm(c[1])})}
  });
  var ks=Object.keys(o.per);
  if(!ks.length)o.warn.push("No he encontrado la tabla de parciales por período.");
  var sm=[0,1].map(function(i){return ks.reduce(function(a,k){return a+o.per[k][i]},0)});
  if(ks.length){if(o.tot[0]===null)o.tot=sm;else if(sm[0]!==o.tot[0]||sm[1]!==o.tot[1])o.warn.push("Los parciales suman "+sm[0]+"-"+sm[1]+" y el total indicado es "+o.tot[0]+"-"+o.tot[1]+".")}
  [0,1].forEach(function(i){
    var tt=o.pl[i].reduce(function(a,x){return a+(x.tot||0)},0),sin=o.pl[i].filter(function(x){return x.tot===null}).length;
    if(o.pl[i].length&&o.tot[i]!==null&&tt!==o.tot[i])o.warn.push(o.teams[i]+": los puntos individuales suman "+tt+" y el total del equipo es "+o.tot[i]+" (diferencia "+(tt-o.tot[i])+"). No se han corregido.");
    if(sin)o.warn.push(o.teams[i]+": "+sin+" jugadores sin total de puntos.");
    var sf=o.pl[i].filter(function(x){return x.f===null}).length;if(o.pl[i].length&&sf)o.warn.push(o.teams[i]+": "+sf+" jugadores sin faltas verificadas.")});
  if(!o.pl[0].length&&!o.pl[1].length)o.warn.push("No he encontrado tablas de jugadores.");
  return o;
}
function cell(v){return v===null?'<span class="mu">—</span>':v}
function timp(P){
  var h='<div class="sw"><table><thead><tr><th>Jugador</th><th>T2</th><th>T3</th><th>TL</th><th>Total</th><th>Faltas</th></tr></thead><tbody>';
  P.slice().sort(function(a,b){return(b.tot||0)-(a.tot||0)}).forEach(function(x){h+="<tr><td>"+esc(x.n)+"</td><td>"+cell(x.t2)+"</td><td>"+cell(x.t3)+"</td><td>"+cell(x.tl)+"</td><td><b>"+cell(x.tot)+"</b></td><td>"+cell(x.f)+"</td></tr>"});
  return h+"</tbody></table></div>";
}
function gameImp(g){
  var T=g.teams,ps=Object.keys(g.per).map(Number).sort(function(a,b){return a-b});
  var h="<div class='pr'>"+ball(28)+" Partidos FCBQ</div><div class='row'><button onclick='goHome()'>← Partidos</button><button onclick='window.print()'>Descargar PDF</button></div><h1>"+esc(T[0]+" - "+T[1])+"</h1><div class='wa'>Resumen importado: no tiene jugadas y no se puede verificar con la cronología.</div>";
  h+="<div class='card'><div class='sc'><div><span>"+esc(T[0])+"</span><br><b>"+cell(g.tot[0])+"</b></div><div class='mu'>puntos</div><div><span>"+esc(T[1])+"</span><br><b>"+cell(g.tot[1])+"</b></div></div>";
  if(ps.length){h+="<div class='sw'><table><thead><tr><th></th>"+ps.map(function(p){return"<th>P"+p+"</th>"}).join("")+"<th>Total</th></tr></thead><tbody>";
    [0,1].forEach(function(i){h+="<tr><td>"+esc(T[i])+"</td>"+ps.map(function(p){return"<td>"+g.per[p][i]+"</td>"}).join("")+"<td><b>"+cell(g.tot[i])+"</b></td></tr>"});h+="</tbody></table></div>"}
  h+="<div class='mu'>"+esc(g.date||"")+" · importado "+fmt(g.updated)+"</div>";
  g.warn.forEach(function(w){h+="<div class='wa'>⚠ "+esc(w)+"</div>"});h+="</div>";
  [0,1].forEach(function(i){h+="<h2>"+esc(T[i])+"</h2>"+(g.pl[i].length?timp(g.pl[i]):"<p class='mu'>Sin jugadores.</p>")});
  h+="<p class='mu'>Los valores T2, T3 y TL son canastas, tal como vienen en el resumen. «—» significa dato no disponible, no cero.</p><details class='card'><summary>Texto original</summary><pre style='white-space:pre-wrap;font-size:.8rem'>"+esc(g.src)+"</pre></details><div class='row'><button onclick='del()'>Eliminar partido</button></div>";
  return h;
}
function impSum(){var v=document.getElementById("rs").value;if(!v.trim()){msg="No hay texto que importar.";render();return}
  var o=parseSum(v);if(!Object.keys(o.per).length&&!o.pl[0].length&&!o.pl[1].length){msg="No he reconocido el formato. Tiene que traer tablas con barras verticales.";render();return}
  games.push(o);save();cur=o.id;render()}
function paste(rep){
  var g=games.find(function(x){return x.id===cur}),v=document.getElementById("tx").value;
  if(!v.trim()){msg="No hay texto que añadir.";render();return}
  var o=parse(v);
  if(!o.parsed){msg="No he encontrado jugadas en el texto. Copia la página completa del partido.";render();return}
  merge(g,o,rep);save();render();
}
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
