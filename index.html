<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partidos FCBQ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9531e">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--soft:#fff4ee;--tx:#17202b;--mu:#667284;--ac:#e25a12;--bd:#f0d9cc;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171d;--card:#1d232c;--soft:#2a211c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#3a3029;--wa:#f5b04c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171d;--card:#1d232c;--soft:#2a211c;--tx:#e8ecf1;--mu:#98a3b3;--ac:#ff8a5c;--bd:#3a3029;--wa:#f5b04c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:1.05rem;margin:1.2rem 0 .4rem}
.hd{display:flex;align-items:center;gap:14px;margin:8px 0 14px}.ic{width:60px;height:60px;border-radius:18px;background:var(--ac);display:grid;place-items:center;box-shadow:0 6px 16px rgba(226,90,18,.3)}.tt{font-size:1.9rem;font-weight:800;line-height:1.1}
.card{background:linear-gradient(180deg,var(--card),var(--soft));border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:11px 18px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
textarea{width:100%;min-height:120px;box-sizing:border-box;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font:14px/1.3 monospace;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.mu{color:var(--mu);font-size:.88rem}.wa{color:var(--wa);font-size:.9rem;margin:.3rem 0}
.em{text-align:center;padding:26px 10px}.em b{display:block;font-size:1.2rem;margin-top:8px}
.bs{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 6px;text-align:center;align-items:center}.big{font-size:3.4rem;line-height:1.1}.dash{font-size:2rem;color:var(--mu)}
.tn{font-weight:700;text-transform:uppercase;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}.td{font-size:.78rem;color:var(--mu)}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 0;text-align:center}
.pc span{display:block;font-size:.78rem;color:var(--mu)}.pc b{font-size:1.25rem}.pc.cur b{color:var(--ac)}.pc i{color:var(--mu);font-style:normal;font-weight:400}
.sw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}.it{display:flex;justify-content:space-between;gap:8px;align-items:center}
summary{font-weight:700;cursor:pointer}.pr{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--soft:#fff;--tx:#000;--mu:#444;--bd:#999;--wa:#7a3b00;--ac:#d9531e;color-scheme:light}body{background:#fff}button,textarea,details,.np{display:none!important}.card{break-inside:avoid;background:#fff}main{padding:0}.pr{display:flex;align-items:center;gap:8px;background:#d9531e;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:1.1rem;margin-bottom:8px}th{background:#fde7dd}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY="fcbq_partidos_v1",games=load(),cur=null,msg="";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(games));return true}catch(e){msg="No se pudo guardar en este navegador.";return false}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ACT=/^(Tir de [23] (anotat|fallat)|Tir lliure (anotat|fallat)|Rebot .+|Assist.+|Pèrdua.*|Recuperació.*|Tap.*|Falta.*|Entra|Surt|Temps mort.*)$/;
var PTS={"Tir de 2 anotat":"t2","Tir de 3 anotat":"t3","Tir lliure anotat":"tl"};
function parse(text){
  var t=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={teams:[],roster:{},markers:{},ev:{},claimed:null,parsed:0,date:null,abbr:[]};
  var di=t.findIndex(function(s){return/^\d{2}\/\d{2}\/\d{4}\s*·/.test(s)});
  if(di>=0){o.date=t[di];for(var i=di+1;i<t.length&&!/^P\d+$/.test(t[i])&&o.teams.length<2;i++)if(!/^\d+$/.test(t[i]))o.teams.push(t[i])}
  var mi=t.findIndex(function(s){return/^Mostrant \d+ jugades/.test(s)});
  if(mi>=0)o.claimed=+t[mi].match(/\d+/)[0];
  var fa=t.findIndex(function(x,i){return t[i+1]==="Tots"&&t[i+2]==="·"});
  if(di>=0&&fa>di){var npc=0;for(var i=di;i<fa;i++)if(/^P\d+$/.test(t[i]))npc++;if(npc>=2&&npc<=12)o.nper=npc}
  var ab=false,lim=mi>=0?mi:t.length;
  for(var i=0;i<lim;i++){
    if(t[i+1]==="Tots"&&t[i+2]==="·"){o.abbr.push(t[i]);ab=true;continue}
    var m=ab&&t[i].match(/^(\d+)\s+(.+)$/);
    if(m)o.roster[m[2]]={team:o.abbr.length-1,dorsal:m[1]};
  }
  var st=mi>=0?mi+1:0,end=t.length;
  for(var i=st;i<t.length-1;i++)if(t[i]==="Quart"&&t[i+1]==="Tots"){end=i;break}
  var first=null;
  for(var i=st;i<end;i++){var m=t[i].match(/^Final Quart (\d+)$/);
    if(m){var n=+m[1];if(first===null)first=n;var sc=(t[i+1]||"").match(/^(\d+)\s*·\s*(\d+)$/);if(sc)o.markers[n]=[+sc[1],+sc[2]]}}
  var per=first===null?null:first+1;
  for(var i=st;i<end;i++){
    var m=t[i].match(/^Final Quart (\d+)$/);if(m){per=+m[1];continue}
    if(!ACT.test(t[i]))continue;
    o.parsed++;
    var act=t[i],name=t[i-1],kind=PTS[act];
    var fc=null;
    if(!kind){if(/^Falta/.test(act)&&!/rebuda/i.test(act)){kind="f";var m2=act.match(/\((\d+) FC\)/);if(m2)fc=+m2[1];else if(/PER|atac/i.test(act))continue}else continue}
    if(!name||/^(\d+|P\d+|\d+:\d+)$/.test(name))continue;
    var p=per;
    if(p===null)for(var j=i+1;j<end;j++){var q=t[j].match(/^P(\d+)$/);if(q){p=+q[1];break}}
    if(p===null)continue;
    var sig=p+"|"+name+"|"+act;
    if(!o.ev[sig])o.ev[sig]={per:p,name:name,kind:kind,n:0,fc:fc};
    o.ev[sig].n++;
  }
  return o;
}
function merge(g,o,replace){
  if(o.teams.length===2&&(!g.teams||g.teams.length<2))g.teams=o.teams;
  if(o.date)g.date=o.date;
  if(o.nper)g.nper=o.nper;
  if(o.abbr.length)g.abbr=o.abbr;
  for(var k in o.roster)g.roster[k]=o.roster[k];
  for(var k in o.markers)g.markers[k]=o.markers[k];
  if(replace)g.ev={};
  for(var s in o.ev){var e=o.ev[s];if(!g.ev[s])g.ev[s]={per:e.per,name:e.name,kind:e.kind,n:e.n,fc:e.fc};else g.ev[s].n=Math.max(g.ev[s].n,e.n)}
  g.claimed=o.claimed;g.parsed=o.parsed;g.updated=Date.now();
}
function calc(g){
  var r={pl:[{},{},{}],pp:[{},{},{}],tot:[0,0,0]},per={};
  for(var s in g.ev){
    var e=g.ev[s],ro=g.roster[e.name],tm=ro?ro.team:2;if(tm>1)tm=2;
    var P=r.pl[tm];if(!P[e.name])P[e.name]={t2:0,t3:0,tl:0,f:0,d:ro?ro.dorsal:"?"};
    if(e.kind==="f"){P[e.name].f+=e.n;if(e.fc)P[e.name].fm=Math.max(P[e.name].fm||0,e.fc)}
    else{var v={t2:2,t3:3,tl:1}[e.kind]*e.n;P[e.name][e.kind]+=v;r.tot[tm]+=v;r.pp[tm][e.per]=(r.pp[tm][e.per]||0)+v;per[e.per]=1}
  }
  r.pl.forEach(function(P){for(var n in P)if(P[n].fm)P[n].f=P[n].fm});
  for(var k in g.markers)per[k]=1;
  r.per=Object.keys(per).map(Number).sort(function(a,b){return a-b});
  r.warn=[];
  r.per.forEach(function(p){var m=g.markers[p];if(!m)return;
    var a=r.pp[0][p]||0,b=r.pp[1][p]||0;
    if(a!==m[0]||b!==m[1])r.warn.push("Período "+p+": las jugadas suman "+a+"-"+b+" pero la web indica "+m[0]+"-"+m[1]+". Faltan o sobran jugadas.")});
  if(g.claimed!=null&&g.parsed!==g.claimed)r.warn.push("La web indicaba "+g.claimed+" jugadas y he leído "+g.parsed+" en la última pegada.");
  if(r.pl[2]&&Object.keys(r.pl[2]).length)r.warn.push("Hay jugadores sin equipo asignado: no se ha leído bien la plantilla de uno de los equipos. Los totales por equipo no son fiables.");
  return r;
}
function title(g){return g.teams&&g.teams.length===2?g.teams[0]+" - "+g.teams[1]:"Partido sin nombre"}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"}
function tbl(P){
  var ns=Object.keys(P).sort(function(a,b){var x=P[a],y=P[b];return(y.t2+y.t3+y.tl)-(x.t2+x.t3+x.tl)||a.localeCompare(b)});
  if(!ns.length)return'<p class="mu">Sin jugadas de puntos ni faltas.</p>';
  var s=[0,0,0,0,0],h='<div class="sw"><table><thead><tr><th>Jugador</th><th>T2</th><th>T3</th><th>TL</th><th>Total</th><th>Faltas</th></tr></thead><tbody>';
  ns.forEach(function(n){var x=P[n],tt=x.t2+x.t3+x.tl;s[0]+=x.t2;s[1]+=x.t3;s[2]+=x.tl;s[3]+=tt;s[4]+=x.f;
    h+="<tr><td>"+esc(x.d)+" "+esc(n)+"</td><td>"+x.t2+"</td><td>"+x.t3+"</td><td>"+x.tl+"</td><td><b>"+tt+"</b></td><td>"+x.f+"</td></tr>"});
  return h+"</tbody><tfoot><tr><td>Equipo</td><td>"+s[0]+"</td><td>"+s[1]+"</td><td>"+s[2]+"</td><td>"+s[3]+"</td><td>"+s[4]+"</td></tr></tfoot></table></div>";
}
function lastBk(){try{var t=+localStorage.getItem(KEY+"_bk");if(!t)return"Todavía no has hecho ninguna copia de seguridad.";var d=Math.floor((Date.now()-t)/864e5);return"Última copia de seguridad: "+(d<1?"hoy":"hace "+d+" días")+"."}catch(e){return""}}
function nper(g,ps){return g.nper||(Math.max.apply(null,ps.concat([0]))>4?8:4)}
function pcells(get,N,cp){var h="<div class='pg'>";for(var p=1;p<=N;p++){var v=get(p);h+="<div class='pc"+(p===cp?" cur":"")+"'><span>P"+p+"</span><b>"+(v===undefined?"<i>—</i>":v)+"</b></div>"}return h+"</div>"}
function board(T,tot,N,gets,cp,sub){
  var h="<div class='card'><div class='bs'><b class='big'>"+cell(tot[0])+"</b><span class='dash'>–</span><b class='big'>"+cell(tot[1])+"</b>";
  h+="<div class='tn'>"+esc(T[0])+"</div><div class='td'>"+esc(sub||"")+"</div><div class='tn'>"+esc(T[1])+"</div></div>";
  return h+"<div class='pgs'>"+pcells(gets[0],N,cp)+pcells(gets[1],N,cp)+"</div>";
}
function won(gets,N,cp){var a=0,b=0,n=0;for(var p=1;p<=N;p++){if(p===cp)continue;var x=gets[0](p),y=gets[1](p);if(x===undefined||y===undefined)continue;n++;if(x>y)a++;else if(y>x)b++}
  return n>=2?"<div class='mu'>Períodos ganados (cuenta propia, no oficial): "+a+" – "+b+"</div>":""}
function home(){
  var h="<div class='hd'><div class='ic'>"+ball(38)+"</div><div><div class='tt'>Partidos</div><div class='mu'>Seguimiento FCBQ</div></div></div>";
  h+="<div class='card'><b>Nuevo partido</b><div class='mu'>Pega el texto copiado de la página del partido: pestaña «Jugada a jugada», seleccionar todo y copiar.</div><textarea id='nt' placeholder='Pega aquí el texto'></textarea><div class='row'><button class='p' onclick='saveNew()'>Guardar partido</button></div></div>";
  if(!games.length)h+="<div class='em'>"+ball(64)+"<b>Todavía no hay partidos</b><div class='mu'>Pega arriba el texto de un partido para empezar.</div></div>";
  games.slice().sort(function(a,b){return(b.updated||0)-(a.updated||0)}).forEach(function(g){
    var imp=g.kind==="resumen",T=imp?g.teams:(g.teams&&g.teams.length===2?g.teams:["Local","Visitante"]),t=imp?g.tot:calc(g).tot;
    h+="<div class='card it'><div><b>"+esc(T[0])+" – "+esc(T[1])+"</b><div><b>"+cell(t[0])+" – "+cell(t[1])+"</b> <span class='mu'>"+(imp?"resumen importado":"con jugadas")+"</span></div><div class='mu'>"+esc(g.date||"")+" · actualizado "+fmt(g.updated)+"</div></div><button onclick='openGame("+g.id+")'>Abrir</button></div>"});
  h+="<details class='card'><summary>Importar resumen de IA y copia de seguridad</summary><div style='margin-top:10px'><b>Importar resumen de una IA</b><div class='mu'>Pega el resumen completo (con tablas). Se guarda como «resumen importado».</div><textarea id='rs' placeholder='Pega aquí el resumen'></textarea><div class='row'><button onclick='impSum()'>Importar resumen</button></div></div>";
  h+="<div style='margin-top:10px'><b>Copia de seguridad</b><div class='mu'>Guarda este texto en Notas o envíatelo. Para recuperar, pégalo y pulsa Restaurar.</div><textarea id='bk' placeholder='Aquí aparece la copia, o pega una para restaurar'></textarea><div class='row'><button class='p' onclick='expAll()'>Copiar copia de seguridad</button><button onclick='impAll()'>Restaurar desde texto</button></div><div class='mu' id='bkm'></div></div></details>";
  h+="<p class='mu' style='text-align:center'>Los partidos se guardan en este navegador o app, en este dispositivo. Se pierden si borras los datos. "+esc(lastBk())+"</p>";
  return h;
}
function game(g){
  var r=calc(g),T=g.teams&&g.teams.length===2?g.teams:["Local","Visitante"];
  var N=nper(g,r.per),mx=r.per.length?r.per[r.per.length-1]:0,cp=(mx&&!g.markers[mx])?mx:0;
  var gets=[0,1].map(function(i){return function(p){return r.per.indexOf(p)>=0?(r.pp[i][p]||0):undefined}});
  var h="<div class='pr'>"+ball(28)+" Partidos FCBQ</div>"+topbar()+"";
  h+=board(T,r.tot,N,gets,cp,g.date)+won(gets,N,cp);
  h+="<div class='mu'>Última actualización: "+fmt(g.updated)+(g.claimed!=null?" · jugadas leídas "+g.parsed+" de "+g.claimed:"")+"</div>";
  r.warn.forEach(function(w){h+="<div class='wa'>⚠ "+esc(w)+"</div>"});h+="</div>";
  if(!rep)h+="<div class='card np'><b>Añadir jugadas</b><div class='mu'>Copia toda la página del partido y pégala aquí.</div><textarea id='tx' placeholder='Pega aquí el texto de la página'></textarea><div class='row'><button class='p' onclick='paste(false)'>Añadir y actualizar</button><button onclick='paste(true)'>Sustituir jugadas</button></div><div class='mu'>«Añadir» conserva lo ya guardado y no duplica. «Sustituir» borra las jugadas guardadas y usa solo esta pegada (útil si la web corrigió algo).</div></div>";
  [0,1].forEach(function(i){h+="<h2>"+esc(T[i])+"</h2>"+tbl(r.pl[i])});
  if(Object.keys(r.pl[2]).length)h+="<h2>Sin equipo asignado</h2>"+tbl(r.pl[2]);
  h+="<p class='mu'>T2: puntos de tiros de 2. T3: puntos de triples. TL: tiros libres. Las faltas cuentan las cometidas por el jugador, sin las recibidas.</p>"+(rep?"":"<div class='row np'><button onclick='del()'>Eliminar partido</button></div>")+"";
  return h;
}
function saveNew(){
  var v=document.getElementById("nt").value;if(!v.trim()){msg="No hay texto que guardar.";render();return}
  var o=parse(v);
  if(!o.parsed){msg=(/\|/.test(v)&&/PUNTOS|PARCIALES/i.test(v))?"Parece un resumen de IA: impórtalo en la sección «Importar resumen de IA».":"No he encontrado jugadas en el texto. Copia la página completa, con la pestaña «Jugada a jugada» abierta.";render();return}
  var g={id:Date.now(),teams:[],abbr:[],roster:{},markers:{},ev:{},updated:null};merge(g,o,false);games.push(g);save();cur=g.id;render();
}
function render(){var g=games.find(function(x){return x.id===cur});
  document.getElementById("app").innerHTML=(g?(g.kind==="resumen"?gameImp(g):game(g)):home())+(msg?"<div class='wa'>"+esc(msg)+"</div>":"");msg=""}
function newGame(){var g={id:Date.now(),teams:[],abbr:[],roster:{},markers:{},ev:{},updated:null};games.push(g);save();cur=g.id;render()}
function openGame(id){cur=id;render()}
var rep=false,repTxt="";
function v(x){return x===null||x===undefined?"—":x}
function pe(s){var m={"–":150,"—":151,"’":146,"“":147,"”":148,"…":133};
  return String(s).split("").map(function(c){var k=m[c]||c.charCodeAt(0);if(k>255)return"?";c=String.fromCharCode(k);return(c==="("||c===")"||c==="\\")?"\\"+c:c}).join("")}
function pdfBuild(g){
  var imp=g.kind==="resumen",T=imp?g.teams:(g.teams&&g.teams.length===2?g.teams:["Local","Visitante"]),r=imp?null:calc(g),tot=imp?g.tot:r.tot;
  var ps=imp?Object.keys(g.per).map(Number):r.per,N=nper(g,ps);
  function get(i,p){if(imp)return g.per[p]?g.per[p][i]:undefined;return r.per.indexOf(p)>=0?(r.pp[i][p]||0):undefined}
  var pages=[],cs,y,OR="0.85 0.33 0.12",GR="0.4 0.4 0.4";
  function np(){cs=[];pages.push(cs);y=800}
  function tx(x,yy,s,sz,b,col){cs.push((col||"0 0 0")+" rg BT /"+(b?"F2":"F1")+" "+sz+" Tf "+x+" "+yy+" Td ("+pe(s)+") Tj ET")}
  function rc(x,yy,w,h,rgb){cs.push(rgb+" rg "+x+" "+yy+" "+w+" "+h+" re f")}
  function wr(s,n){var o=[],l="";String(s).split(" ").forEach(function(w){if((l+" "+w).trim().length>n){o.push(l);l=w}else l=(l+" "+w).trim()});if(l)o.push(l);return o}
  function chk(h){if(y-h<45)np()}
  np();rc(40,y-22,515,30,OR);tx(50,y-14,"Partidos FCBQ · Informe del partido",13,1,"1 1 1");y-=50;
  [0,1].forEach(function(i){var x=[40,310][i];tx(x,y-30,String(v(tot[i])),40,1,OR);
    wr(T[i].toUpperCase(),30).slice(0,2).forEach(function(l,k){tx(x,y-52-k*12,l,10,1)})});
  y-=95;if(g.date){tx(40,y,g.date,9,0,GR);y-=14}
  y-=10;
  [0,1].forEach(function(i){var x=[40,310][i],yy=y;for(var rw=0;rw<Math.ceil(N/4);rw++){for(var c=0;c<4;c++){var p=rw*4+c+1;if(p>N)break;var q=get(i,p);tx(x+c*62,yy,"P"+p,8,0,GR);tx(x+c*62,yy-14,q===undefined?"—":String(q),13,1)}yy-=36}});
  y-=36*Math.ceil(N/4)+8;
  [0,1].forEach(function(i){
    var P=imp?g.pl[i].slice():Object.keys(r.pl[i]).map(function(n){var x=r.pl[i][n];return{n:x.d+" "+n,t2:x.t2,t3:x.t3,tl:x.tl,tot:x.t2+x.t3+x.tl,f:x.f}});
    P.sort(function(a,b){return(b.tot||0)-(a.tot||0)});
    chk(60);tx(40,y,T[i].toUpperCase(),11,1);y-=16;rc(40,y-4,515,14,"0.99 0.91 0.87");
    [["Jugador",44],["T2",300],["T3",345],["TL",390],["Total",435],["Faltas",495]].forEach(function(h){tx(h[1],y,h[0],9,1)});y-=16;

    y-=10});
  chk(30);tx(40,y,"T2, T3 y TL: "+(imp?(g.parcial?"puntos identificados solo en parte de las jugadas":"canastas, según el resumen"):"puntos")+". «—» = dato no disponible, no cero.",8,0,GR);y-=14;
  (imp?g.warn:r.warn).forEach(function(s){wr("Aviso: "+s,105).forEach(function(l){chk(12);tx(40,y,l,8.5,0,"0.7 0.3 0");y-=11})});
  chk(20);tx(40,y-6,"Generado el "+new Date().toLocaleDateString("es-ES")+" con Partidos FCBQ",8,0,"0.5 0.5 0.5");
  var objs=[];function add(o){objs.push(o)}

function pdfShare(){
  var g=games.find(function(x){return x.id===cur});if(!g)return;
  var b64;try{b64=pdfBuild(g)}catch(e){msg="No se pudo generar el PDF: "+e.message;render();return}
  var T=g.teams&&g.teams.length===2?g.teams:["partido"],name=("Partido-"+T.join("-")).replace(/[^A-Za-z0-9]+/g,"-").slice(0,50)+".pdf";
  var C=window.Capacitor,P=C&&C.Plugins,FS=P&&P.Filesystem,SH=P&&P.Share;
  if(FS&&SH){
    FS.writeFile({path:name,data:b64,directory:"CACHE"}).then(function(r){return SH.share({title:"Informe del partido",files:[r.uri],dialogTitle:"Guardar o enviar el PDF"})})
     .catch(function(e){var m=String(e&&e.message?e.message:e);if(/cancel/i.test(m))return;msg="No se pudo compartir el PDF: "+m;render()});
    return}
  try{var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([u],{type:"application/pdf"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
  catch(e){msg="Este navegador no permite descargar el PDF. Usa «Copiar informe».";render()}
}
function topbar(){

}
function openRep(){rep=true;repTxt="";render()}

function repText(g){
  var imp=g.kind==="resumen",T=imp?g.teams:(g.teams&&g.teams.length===2?g.teams:["Local","Visitante"]),r=imp?null:calc(g),tot=imp?g.tot:r.tot;
  var ps=imp?Object.keys(g.per).map(Number).sort(function(a,b){return a-b}):r.per;
  var L=["INFORME DEL PARTIDO",T[0]+" "+v(tot[0])+" - "+v(tot[1])+" "+T[1]];
  if(g.date)L.push(g.date);
  if(imp)L.push("(Resumen importado: no se puede verificar con jugadas)");
  L.push("","PARCIALES");
  ps.forEach(function(p){var a=imp?g.per[p][0]:(r.pp[0][p]||0),b=imp?g.per[p][1]:(r.pp[1][p]||0);L.push("P"+p+": "+a+" - "+b)});
  [0,1].forEach(function(i){
    L.push("",T[i].toUpperCase());
    var P=imp?g.pl[i]:Object.keys(r.pl[i]).map(function(n){var x=r.pl[i][n];return{n:x.d+" "+n,t2:x.t2,t3:x.t3,tl:x.tl,tot:x.t2+x.t3+x.tl,f:x.f}});
    P=P.slice().sort(function(a,b){return(b.tot||0)-(a.tot||0)});
    P.forEach(function(x){L.push(x.n+": T2 "+v(x.t2)+", T3 "+v(x.t3)+", TL "+v(x.tl)+", Total "+v(x.tot)+", Faltas "+v(x.f))})
  });
  L.push("","T2, T3 y TL: "+(imp?(g.parcial?"puntos identificados solo en parte de las jugadas":"canastas, según el resumen"):"puntos")+". «—» = dato no disponible, no cero.");
  var w=imp?g.warn:r.warn;if(w.length){L.push("","AVISOS");w.forEach(function(x){L.push("- "+x)})}
  return L.join("\n");
}
function copyRep(){

  repTxt=repText(g);
  try{navigator.clipboard.writeText(repTxt).then(function(){msg="Informe copiado. Pégalo en Notas o WhatsApp."},function(){msg="No se pudo copiar solo: selecciona el texto de abajo y cópialo."}).then(render)}
  catch(e){msg="No se pudo copiar solo: selecciona el texto de abajo y cópialo.";render()}

function impAll(){var v=document.getElementById("bk").value,d;
  try{d=JSON.parse(v);if(!d||!Array.isArray(d.games))throw 0}catch(e){bkm("El texto no es una copia válida.");return}

function ball(n){return'<svg width="'+n+'" height="'+n+'" viewBox="0 0 32 32" style="vertical-align:middle" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8662f" stroke="#fff" stroke-width="2"/><g fill="none" stroke="#3b1608" stroke-width="1.6"><path d="M16 2v28M2 16h28"/><path d="M5.5 5.5c6 6 6 15 0 21M26.5 5.5c-6 6-6 15 0 21"/></g></svg>'}
function nz(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function tmx(x,T){x=nz(x);if(x.length<2)return-1;for(var i=0;i<2;i++){var t=nz(T[i]);if(t.indexOf(x)>=0||x.indexOf(t)>=0)return i}return-1}
function nm(x){return/^\d+$/.test(x)?+x:null}
var HRE=/^(?:#+\s*)?(\d+)\\?\.\s+[A-ZÀ-Ú ]+$/;
function parseSum(text){
  var L=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={id:Date.now(),kind:"resumen",teams:["Local","Visitante"],date:null,per:{},tot:[null,null],pl:[[],[]],warn:[],src:text.slice(0,30000),updated:Date.now(),live:0,parcial:false};
  var named=false;
  var tl=L.find(function(s){return/\s+vs\.?\s+/i.test(s)&&s.length<160});
  if(tl){var p=tl.replace(/^#+\s*/,"").split("—").pop().split(/\s+vs\.?\s+/i);if(p.length===2){o.teams=[p[0].trim(),p[1].trim()];named=true}}
  if(!named){var s1=0,cand=[];L.forEach(function(l){var h=l.match(HRE);if(h){s1=+h[1];return}
    if(s1===1&&l[0]!=="|"&&l[0]!=="#"&&l.length<60&&l.indexOf(":")<0&&!/^P\d/.test(l)&&cand.length<2)cand.push(l)});
    if(cand.length===2)o.teams=cand;else o.warn.push("No he podido leer los nombres de los equipos.")}
  var dm=text.match(/(\d{2}\/\d{2}\/\d{4})/);if(dm)o.date=dm[1];
  var sec=0,ct=-1,ht=[0,1],col={t2:1,t3:2,tl:3,tot:4};
  L.forEach(function(l){
    var h=l.match(HRE);
    if(h){sec=+h[1];ct=-1;return}
    if(l[0]!=="|"){if((sec===3||sec===5)&&l.length<60&&l.indexOf(":")<0){var t=tmx(l,o.teams);if(t>=0)ct=t}return}
    var c=l.split("|").slice(1,-1).map(function(x){return x.trim()});
    if(!c.length||/^[-: ]+$/.test(c.join("")))return;
    if(sec===2){
      if(/^periodo/i.test(c[0])){ht=[tmx(c[1]||"",o.teams),tmx(c[2]||"",o.teams)];return}
      var pm=c[0].match(/^P(\d+)/),a=nm(c[1]),b=nm(c[2]);
      if(pm&&a!==null&&b!==null){o.per[+pm[1]]=ht[0]===1?[b,a]:[a,b];
        var lv=c[0].match(/\((.+)\)/);if(lv&&/juego|registrado/i.test(lv[1])){o.live=+pm[1];o.warn.push("P"+pm[1]+" figura como «"+lv[1]+"»: el marcador puede no ser definitivo.")}}
      else if(/^total/i.test(c[0])&&a!==null&&b!==null)o.tot=ht[0]===1?[b,a]:[a,b];
      return}
    if(sec===3&&/^jugador/i.test(c[0])){
      col={t2:-1,t3:-1,tl:-1,tot:-1};
      c.forEach(function(x,i){if(!i)return;if(/total/i.test(x))col.tot=i;else if(/T2/.test(x))col.t2=i;else if(/T3/.test(x))col.t3=i;else if(/TL/.test(x))col.tl=i});
      if(/identificad/i.test(c.join(" ")))o.parcial=true;return}
    if(ct<0||/^(jugador|suma|marcador|diferencia|resto)/i.test(c[0]))return;
    function g2(i){return i>=0?nm(c[i]||""):null}
    if(sec===3)o.pl[ct].push({n:c[0],t2:g2(col.t2),t3:g2(col.t3),tl:g2(col.tl),tot:g2(col.tot),f:null});
    else if(sec===5){var k=nz(c[0]),e=o.pl[ct].find(function(x){return nz(x.n)===k});
      if(e)e.f=nm(c[1]);else o.pl[ct].push({n:c[0],t2:null,t3:null,tl:null,tot:null,f:nm(c[1])})}
  });
  var ks=Object.keys(o.per);
  if(!ks.length)o.warn.push("No he encontrado la tabla de parciales por período.");
  var sm=[0,1].map(function(i){return ks.reduce(function(a,k){return a+o.per[k][i]},0)});
  if(ks.length){var st=o.tot;o.tot=sm;if(st[0]!==null&&(sm[0]!==st[0]||sm[1]!==st[1]))o.warn.push("El total indicado en el resumen era "+st[0]+"-"+st[1]+" y los parciales suman "+sm[0]+"-"+sm[1]+". Se muestra la suma de parciales (marcador real)."+(Math.abs(sm[0]-sm[1])>50?" La web oficial limita a 50 puntos la diferencia que muestra.":""))}
  [0,1].forEach(function(i){
    var tt=o.pl[i].reduce(function(a,x){return a+(x.tot||0)},0),sin=o.pl[i].filter(function(x){return x.tot===null}).length;
    if(o.pl[i].length&&o.tot[i]!==null&&tt!==o.tot[i])o.warn.push(o.teams[i]+": los puntos individuales suman "+tt+" y el total del equipo es "+o.tot[i]+" (diferencia "+(tt-o.tot[i])+"). No se han corregido.");
    if(sin)o.warn.push(o.teams[i]+": "+sin+" jugadores sin total de puntos.");
    var sf=o.pl[i].filter(function(x){return x.f===null}).length;if(o.pl[i].length&&sf)o.warn.push(o.teams[i]+": "+sf+" jugadores sin faltas verificadas.")});
  if(!o.pl[0].length&&!o.pl[1].length)o.warn.push("No he encontrado tablas de jugadores.");
  return o;
}

  return h+"</tbody></table></div>";
}
function gameImp(g){

  h+="<p class='mu'>"+(g.parcial?"Los valores T2, T3 y TL son puntos identificados solo en parte de las jugadas (por ejemplo, P7 y P8), no el desglose completo.":"Los valores T2, T3 y TL son canastas, tal como vienen en el resumen.")+" «—» significa dato no disponible, no cero.</p><details class='card'><summary>Texto original</summary><pre style='white-space:pre-wrap;font-size:.8rem'>"+esc(g.src)+"</pre></details>"+(rep?"":"<div class='row np'><button onclick='del()'>Eliminar partido</button></div>")+"";
  return h;
}
