<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partidos FCBQ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#e8590c;--ac2:#fff1e8;--bd:#e5e7eb;--bd2:#f0f1f3;--wa:#92400e;--wab:#fffbeb;--waf:#fde68a;--dg:#b42318;--dgb:#fecdca;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.55rem;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:.78rem;margin:24px 4px 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--ac);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(232,89,12,.28)}
.mu{color:var(--mu);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.card>b:first-child{font-size:1.02rem}
.hero{border-color:#f7c7ad;background:linear-gradient(180deg,#fff 0%,var(--ac2) 160%)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
button{font:inherit;font-weight:600;min-height:44px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:0 16px;cursor:pointer;transition:transform .05s,background .15s}
button:active{transform:scale(.97);background:#f3f4f6}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.p:active{background:#c94a07}
button.dg{color:var(--dg);border-color:var(--dgb);background:#fff}
button.back{border:0;background:none;color:var(--ac);padding:0 8px 0 0;min-height:40px;font-size:1.02rem}
.bar{display:flex;align-items:center;margin:0 0 4px}
input[type=url],textarea{width:100%;box-sizing:border-box;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
input[type=url]{min-height:46px;font-size:.95rem}
textarea{min-height:120px;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(232,89,12,.15)}
.game{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:8px 0;cursor:pointer;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.game:active{background:#f9fafb}
.gi{min-width:0}.gt{font-weight:700;overflow-wrap:anywhere}.gm{color:var(--mu);font-size:.82rem;margin-top:2px}
.chip{flex:none;background:var(--ac2);color:#b4470a;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 16px;color:var(--mu)}.empty b{display:block;color:var(--tx);margin:6px 0 2px}.ei{font-size:2.2rem}
.sb{padding:18px 16px 12px}
.sbt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.tn{font-size:.9rem;font-weight:600;color:var(--mu);overflow-wrap:anywhere}
.pt{font-size:2.8rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:#9ca3af}
.pt.win{color:var(--tx)}
.vs{color:#d1d5db;font-size:1.6rem}
.meta{margin-top:10px}
.wa{background:var(--wab);border:1px solid var(--waf);color:var(--wa);border-radius:10px;padding:8px 10px;font-size:.88rem;margin:8px 0 0}
.sw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:700;padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--bd2);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid var(--bd);border-bottom:0}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";color:var(--mu);font-size:1.3rem;line-height:1}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:6px}
.foot{color:var(--mu);font-size:.8rem;text-align:center;margin:20px 8px 0}
.leg{color:var(--mu);font-size:.8rem;margin:14px 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:.92rem;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY="fcbq_partidos_v1",games=load(),cur=null,msg="",showTools=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
var NP=null;try{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())NP=Capacitor.registerPlugin("Preferences")}catch(e){}
function mirror(){if(NP){try{NP.set({key:KEY,value:JSON.stringify(games)})}catch(e){}}}
function save(){mirror();try{localStorage.setItem(KEY,JSON.stringify(games));return true}catch(e){msg="No se pudo guardar en este dispositivo.";return false}}
function restoreNative(){if(!NP||games.length)return;try{NP.get({key:KEY}).then(function(r){var d=r&&r.value?JSON.parse(r.value):null;if(d&&d.length&&!games.length){games=d;try{localStorage.setItem(KEY,JSON.stringify(games))}catch(e){}render()}})}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ACT=/^(Tir de [23] (anotat|fallat)|Tir lliure (anotat|fallat)|Rebot .+|Assist.+|Pèrdua|Recuperació|Tap.*|Falta.*|Entra|Surt|Temps mort.*)$/;
var PTS={"Tir de 2 anotat":"t2","Tir de 3 anotat":"t3","Tir lliure anotat":"tl"};
function parse(text){
  var t=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={teams:[],roster:{},markers:{},ev:{},claimed:null,parsed:0,date:null,abbr:[]};
  var di=t.findIndex(function(s){return/^\d{2}\/\d{2}\/\d{4}\s*·/.test(s)});
  if(di>=0){o.date=t[di];for(var i=di+1;i<t.length&&!/^P\d+$/.test(t[i])&&o.teams.length<2;i++)if(!/^\d+$/.test(t[i]))o.teams.push(t[i])}
  var mi=t.findIndex(function(s){return/^Mostrant \d+ jugades/.test(s)});
  if(mi>=0)o.claimed=+t[mi].match(/\d+/)[0];
  var ab=false,lim=mi>=0?mi:t.length;
  for(var i=0;i<lim;i++){
    if(/^[A-ZÀ-Ú]{2,5}$/.test(t[i])&&t[i+1]==="Tots"){o.abbr.push(t[i]);ab=true;continue}
    var m=ab&&t[i].match(/^(\d+)\s+(.+)$/);
    if(m)o.roster[m[2]]={team:o.abbr.length-1,dorsal:m[1]};
  }
  var st=mi>=0?mi+1:0,end=t.length;
  for(var i=st;i<t.length-1;i++)if(t[i]==="Quart"&&t[i+1]==="Tots"){end=i;break}
  var first=null;
  for(var i=st;i<end;i++){var m=t[i].match(/^Final Quart (\d+)$/);
    if(m){var n=+m[1];if(first===null)first=n;var sc=(t[i+1]||"").match(/^(\d+)\s*·\s*(\d+)$/);if(sc)o.markers[n]=[+sc[1],+sc[2]]}}
  var per=first===null?null:first+1;
  for(var i=st;i<end;i++){
    var m=t[i].match(/^Final Quart (\d+)$/);if(m){per=+m[1];continue}
    if(!ACT.test(t[i]))continue;
    o.parsed++;
    var act=t[i],name=t[i-1],kind=PTS[act];
    if(!kind){if(/^Falta/.test(act)&&!/rebuda/i.test(act))kind="f";else continue}
    if(!name||/^(\d+|P\d+|\d+:\d+)$/.test(name))continue;
    var p=per;
    if(p===null)for(var j=i+1;j<end;j++){var q=t[j].match(/^P(\d+)$/);if(q){p=+q[1];break}}
    if(p===null)continue;
    var sig=p+"|"+name+"|"+act;
    if(!o.ev[sig])o.ev[sig]={per:p,name:name,kind:kind,n:0};
    o.ev[sig].n++;
  }
  return o;
}
function merge(g,o,replace){
  if(o.teams.length===2&&(!g.teams||g.teams.length<2))g.teams=o.teams;
  if(o.date)g.date=o.date;
  if(o.abbr.length)g.abbr=o.abbr;
  for(var k in o.roster)g.roster[k]=o.roster[k];
  for(var k in o.markers)g.markers[k]=o.markers[k];
  if(replace)g.ev={};
  for(var s in o.ev){var e=o.ev[s];if(!g.ev[s])g.ev[s]={per:e.per,name:e.name,kind:e.kind,n:e.n};else g.ev[s].n=Math.max(g.ev[s].n,e.n)}
  g.claimed=o.claimed;g.parsed=o.parsed;g.updated=Date.now();
}
function calc(g){
  var r={pl:[{},{},{}],pp:[{},{},{}],tot:[0,0,0]},per={};
  for(var s in g.ev){
    var e=g.ev[s],ro=g.roster[e.name],tm=ro?ro.team:2;if(tm>1)tm=2;
    var P=r.pl[tm];if(!P[e.name])P[e.name]={t2:0,t3:0,tl:0,f:0,d:ro?ro.dorsal:"?"};
    if(e.kind==="f")P[e.name].f+=e.n;
    else{var v={t2:2,t3:3,tl:1}[e.kind]*e.n;P[e.name][e.kind]+=v;r.tot[tm]+=v;r.pp[tm][e.per]=(r.pp[tm][e.per]||0)+v;per[e.per]=1}
  }
  for(var k in g.markers)per[k]=1;
  r.per=Object.keys(per).map(Number).sort(function(a,b){return a-b});
  r.warn=[];
  r.per.forEach(function(p){var m=g.markers[p];if(!m)return;
    var a=r.pp[0][p]||0,b=r.pp[1][p]||0;
    if(a!==m[0]||b!==m[1])r.warn.push("Período "+p+": las jugadas suman "+a+"-"+b+" pero la web indica "+m[0]+"-"+m[1]+". Faltan o sobran jugadas.")});
  if(g.claimed!=null&&g.parsed!==g.claimed)r.warn.push("La web indicaba "+g.claimed+" jugadas y he leído "+g.parsed+" en la última pegada.");
  if(r.pl[2]&&Object.keys(r.pl[2]).length)r.warn.push("Hay jugadores sin equipo asignado (falta la plantilla en lo pegado).");
  return r;
}
function title(g){return g.teams&&g.teams.length===2?g.teams[0]+" - "+g.teams[1]:"Partido sin nombre"}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"}
function tbl(P){
  var ns=Object.keys(P).sort(function(a,b){var x=P[a],y=P[b];return(y.t2+y.t3+y.tl)-(x.t2+x.t3+x.tl)||a.localeCompare(b)});
  if(!ns.length)return'<p class="mu">Sin jugadas de puntos ni faltas.</p>';
  var s=[0,0,0,0,0],h='<div class="sw"><table><thead><tr><th>Jugador</th><th>T2</th><th>T3</th><th>TL</th><th>Total</th><th>Faltas</th></tr></thead><tbody>';
  ns.forEach(function(n){var x=P[n],tt=x.t2+x.t3+x.tl;s[0]+=x.t2;s[1]+=x.t3;s[2]+=x.tl;s[3]+=tt;s[4]+=x.f;
    h+="<tr><td>"+esc(x.d)+" "+esc(n)+"</td><td>"+x.t2+"</td><td>"+x.t3+"</td><td>"+x.tl+"</td><td><b>"+tt+"</b></td><td>"+x.f+"</td></tr>"});
  return h+"</tbody><tfoot><tr><td>Equipo</td><td>"+s[0]+"</td><td>"+s[1]+"</td><td>"+s[2]+"</td><td>"+s[3]+"</td><td>"+s[4]+"</td></tr></tfoot></table></div>";
}
function scoreTxt(g){
  if(g.kind==="resumen")return(g.tot[0]===null||g.tot[1]===null)?"Resumen":g.tot[0]+" – "+g.tot[1];
  if(!g.parsed)return"Sin datos";
  var r=calc(g);return r.tot[0]+" – "+r.tot[1];
}
function scoreboard(T,tot,ps,get,meta,warns){
  var a=tot[0],b=tot[1],ok=a!==null&&b!==null,w0=ok&&a>b,w1=ok&&b>a;
  var h="<div class='card sb'><div class='sbt'><div class='side'><div class='tn'>"+esc(T[0])+"</div><div class='pt"+(w0?" win":"")+"'>"+cell(a)+"</div></div><div class='vs'>–</div><div class='side'><div class='tn'>"+esc(T[1])+"</div><div class='pt"+(w1?" win":"")+"'>"+cell(b)+"</div></div></div>";
  if(ps.length){h+="<div class='sw'><table><thead><tr><th></th>"+ps.map(function(p){return"<th>P"+p+"</th>"}).join("")+"<th>Total</th></tr></thead><tbody>";
    [0,1].forEach(function(i){h+="<tr><td>"+esc(T[i])+"</td>"+ps.map(function(p){return"<td>"+get(i,p)+"</td>"}).join("")+"<td><b>"+cell(tot[i])+"</b></td></tr>"});h+="</tbody></table></div>"}
  h+="<div class='mu meta'>"+meta+"</div>";
  warns.forEach(function(w){h+="<div class='wa'>⚠ "+esc(w)+"</div>"});
  return h+"</div>";
}
function go(id){if(id!==null&&cur===null){try{history.pushState({g:1},"")}catch(e){}}cur=id;render();window.scrollTo(0,0)}
window.addEventListener("popstate",function(){cur=null;render()});
/* ---------- PDF (sin librerías, funciona sin conexión) ---------- */
var PW=595,PH=842,MG=40;
var HR=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
var HBd=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
var SP={8211:150,8212:151,8216:145,8217:146,8220:147,8221:148,8226:149,8364:128,8230:133};
function wch(c,b){var k=c.charCodeAt(0);if(k<32)return 0;var t=b?HBd:HR;
  if(k>=32&&k<=126)return t[k-32];
  var base=c.normalize("NFD").charAt(0),kb=base.charCodeAt(0);
  if(kb>=32&&kb<=126)return t[kb-32];return 556}
function tw(s,sz,b){var w=0;s=String(s);for(var i=0;i<s.length;i++)w+=wch(s.charAt(i),b);return w*sz/1000}
function enc(s){var o="";s=String(s);for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<32)continue;
  if(SP[c]!==undefined)c=SP[c];else if(c>255||(c>=128&&c<160))c=63;
  var ch=String.fromCharCode(c);if(ch==="("||ch===")"||ch==="\\")ch="\\"+ch;o+=ch}return o}
function wrap(s,w,sz,b){var words=String(s).split(/\s+/),L=[],c="";
  words.forEach(function(x){var t=c?c+" "+x:x;if(tw(t,sz,b)>w&&c){L.push(c);c=x}else c=t});if(c)L.push(c);return L}
function pdfNew(){
  var d={pages:[],ops:null};
  d.page=function(){d.ops=[];d.pages.push(d.ops)};
  d.col=function(c){var n=parseInt(c.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(function(x){return x.toFixed(3)}).join(" ")};
  d.text=function(x,y,s,o){o=o||{};var sz=o.size||10,w=tw(s,sz,o.bold);
    if(o.align==="right")x-=w;else if(o.align==="center")x-=w/2;
    d.ops.push(d.col(o.color||"#111827")+" rg BT /"+(o.bold?"F2":"F1")+" "+sz+" Tf "+x.toFixed(2)+" "+(PH-y).toFixed(2)+" Td ("+enc(s)+") Tj ET")};
  d.rect=function(x,y,w,h,fill){d.ops.push(d.col(fill)+" rg "+x.toFixed(2)+" "+(PH-y-h).toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2)+" re f")};
  d.line=function(x1,y1,x2,y2,c,lw){d.ops.push(d.col(c||"#e5e7eb")+" RG "+(lw||.6)+" w "+x1.toFixed(2)+" "+(PH-y1).toFixed(2)+" m "+x2.toFixed(2)+" "+(PH-y2).toFixed(2)+" l S")};
  d.build=function(){
    var objs=[],n=d.pages.length,kids=[],i,k;
    objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
    for(i=0;i<n;i++)kids.push((5+i*2)+" 0 R");
    objs[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
    objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    d.pages.forEach(function(ops,i){var pn=5+i*2,cn=pn+1,c=ops.join("\n");
      objs[pn]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+cn+" 0 R >>";
      objs[cn]="<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream"});
    var out="%PDF-1.4\n",off=[];
    for(k=1;k<objs.length;k++){off[k]=out.length;out+=k+" 0 obj\n"+objs[k]+"\nendobj\n"}
    var xr=out.length;out+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
    for(k=1;k<objs.length;k++)out+=("0000000000"+off[k]).slice(-10)+" 00000 n \n";
    return out+"trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF"};
  d.page();return d;
}
function reportData(g){
  function nn(v){return v===null||v===undefined?"-":String(v)}
  if(g.kind==="resumen"){
    var ps=Object.keys(g.per).map(Number).sort(function(a,b){return a-b});
    return{T:g.teams,tot:g.tot,ps:ps,get:function(i,p){return g.per[p][i]},date:g.date,sub:"Resumen importado de una IA (sin jugadas)",
      tabs:[0,1].map(function(i){return{t:g.teams[i],rows:g.pl[i].map(function(x){return{n:x.n,t2:nn(x.t2),t3:nn(x.t3),tl:nn(x.tl),tot:x.tot,ts:nn(x.tot),f:nn(x.f),fv:x.f}}).sort(function(a,b){return(b.tot||0)-(a.tot||0)})}}),
      warn:g.warn,sums:false,leg:"Los valores T2, T3 y TL son canastas, tal como vienen en el resumen. «-» significa dato no disponible, no cero."}
  }
  var r=calc(g),T=g.teams&&g.teams.length===2?g.teams:["Local","Visitante"];
  function rows(P){return Object.keys(P).map(function(n){var x=P[n],t=x.t2+x.t3+x.tl;return{n:(x.d&&x.d!=="?"?x.d+" ":"")+n,t2:String(x.t2),t3:String(x.t3),tl:String(x.tl),tot:t,ts:String(t),f:String(x.f),fv:x.f,a2:x.t2,a3:x.t3,al:x.tl}}).sort(function(a,b){return b.tot-a.tot||a.n.localeCompare(b.n)})}
  var tabs=[{t:T[0],rows:rows(r.pl[0])},{t:T[1],rows:rows(r.pl[1])}];
  if(Object.keys(r.pl[2]).length)tabs.push({t:"Sin equipo asignado",rows:rows(r.pl[2])});
  return{T:T,tot:r.tot.slice(0,2),ps:r.per,get:function(i,p){return r.pp[i][p]||0},date:g.date,
    sub:"Jugadas leídas: "+g.parsed+(g.claimed!=null?" de "+g.claimed:""),tabs:tabs,warn:r.warn,sums:true,
    leg:"T2: puntos de tiros de 2. T3: puntos de triples. TL: tiros libres. Las faltas son las cometidas por el jugador."}

function nz(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function tmx(x,T){x=nz(x);if(x.length<2)return-1;for(var i=0;i<2;i++){var t=nz(T[i]);if(t.indexOf(x)>=0||x.indexOf(t)>=0)return i}return-1}

function parseSum(text){
  var L=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var o={id:Date.now(),kind:"resumen",teams:["Local","Visitante"],date:null,per:{},tot:[null,null],pl:[[],[]],warn:[],src:text.slice(0,30000),updated:Date.now()};
  var tl=L.find(function(s){return/\s+vs\.?\s+/i.test(s)&&s.length<160});
  if(tl){var p=tl.replace(/^#+\s*/,"").split("—").pop().split(/\s+vs\.?\s+/i);if(p.length===2)o.teams=[p[0].trim(),p[1].trim()]}
  var dm=text.match(/(\d{2}\/\d{2}\/\d{4})/);if(dm)o.date=dm[1];
  var sec=0,ct=-1,ht=[0,1];
  L.forEach(function(l){
    var h=l.match(/^(?:#+\s*)?(\d+)\\?\.\s+[A-ZÀ-Ú ]+$/);
    if(h){sec=+h[1];ct=-1;return}
    if(l[0]!=="|"){if((sec===3||sec===5)&&l.length<60&&l.indexOf(":")<0){var t=tmx(l,o.teams);if(t>=0)ct=t}return}
    var c=l.split("|").slice(1,-1).map(function(x){return x.trim()});
    if(!c.length||/^[-: ]+$/.test(c.join("")))return;
    if(sec===2){
      if(/^periodo/i.test(c[0])){ht=[tmx(c[1]||"",o.teams),tmx(c[2]||"",o.teams)];return}
      var pm=c[0].match(/^P(\d+)/),a=nm(c[1]),b=nm(c[2]);
      if(pm&&a!==null&&b!==null)o.per[+pm[1]]=ht[0]===1?[b,a]:[a,b];
      else if(/^total/i.test(c[0])&&a!==null&&b!==null)o.tot=ht[0]===1?[b,a]:[a,b];
      return}
    if(ct<0||/^(jugador|suma|marcador|diferencia|resto)/i.test(c[0]))return;
    if(sec===3)o.pl[ct].push({n:c[0],t2:nm(c[1]),t3:nm(c[2]),tl:nm(c[3]),tot:nm(c[4]),f:null});
    else if(sec===5){var k=nz(c[0]),e=o.pl[ct].find(function(x){return nz(x.n)===k});
      if(e)e.f=nm(c[1]);else o.pl[ct].push({n:c[0],t2:null,t3:null,tl:null,tot:null,f:nm(c[1])})}
  });
  var ks=Object.keys(o.per);
  if(!ks.length)o.warn.push("No he encontrado la tabla de parciales por período.");
  var sm=[0,1].map(function(i){return ks.reduce(function(a,k){return a+o.per[k][i]},0)});
  if(ks.length){if(o.tot[0]===null)o.tot=sm;else if(sm[0]!==o.tot[0]||sm[1]!==o.tot[1])o.warn.push("Los parciales suman "+sm[0]+"-"+sm[1]+" y el total indicado es "+o.tot[0]+"-"+o.tot[1]+".")}
  [0,1].forEach(function(i){
    var tt=o.pl[i].reduce(function(a,x){return a+(x.tot||0)},0),sin=o.pl[i].filter(function(x){return x.tot===null}).length;
    if(o.pl[i].length&&o.tot[i]!==null&&tt!==o.tot[i])o.warn.push(o.teams[i]+": los puntos individuales suman "+tt+" y el total del equipo es "+o.tot[i]+" (diferencia "+(tt-o.tot[i])+"). No se han corregido.");
    if(sin)o.warn.push(o.teams[i]+": "+sin+" jugadores sin total de puntos.");
    var sf=o.pl[i].filter(function(x){return x.f===null}).length;if(o.pl[i].length&&sf)o.warn.push(o.teams[i]+": "+sf+" jugadores sin faltas verificadas.")});
  if(!o.pl[0].length&&!o.pl[1].length)o.warn.push("No he encontrado tablas de jugadores.");
  return o;
}

  return h;
}
function impSum(){var v=document.getElementById("rs").value;if(!v.trim()){msg="No hay texto que importar.";render();return}
  var o=parseSum(v);if(!Object.keys(o.per).length&&!o.pl[0].length&&!o.pl[1].length){msg="No he reconocido el formato. Tiene que traer tablas con barras verticales.";render();return}
  games.push(o);save();go(o.id)}
function apply(g,v,rep,fromCap){
  function keep(){var t=document.getElementById("tx");if(t)t.value=v||"";var d=document.getElementById("ad");if(d)d.open=true}
  if(!v||!v.trim()){msg="No hay texto que añadir.";render();return}
  var o=parse(v);
  if(!o.parsed){msg=fromCap?"Capturé "+v.length+" caracteres pero no he encontrado jugadas. Dejo el texto abajo para que lo revises.":"No he encontrado jugadas en el texto. Copia la página completa del partido.";render();keep();return}
  merge(g,o,rep);save();msg="Partido actualizado: "+o.parsed+" jugadas leídas.";render();
}
function paste(rep){
  var g=games.find(function(x){return x.id===cur});
  apply(g,document.getElementById("tx").value,rep,false);
}
function capScript(){
  if(!window.__fc){
    window.__fc={done:false,text:""};
    (async function(){
      var sl=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
      await sl(2500);
      var last="",same=0;
      for(var i=0;i<70&&same<4;i++){
        var all=[document.scrollingElement||document.documentElement].concat(Array.prototype.slice.call(document.querySelectorAll("*")).filter(function(e){return e.scrollHeight>e.clientHeight+50&&/(auto|scroll)/.test(getComputedStyle(e).overflowY)}));
        var h=0;
        all.forEach(function(e){h+=e.scrollHeight;try{e.scrollTop=e.scrollHeight}catch(x){}});
        window.scrollTo(0,document.body.scrollHeight);
        await sl(900);
        var sig=h+"|"+document.body.innerText.length;
        if(sig===last&&document.body.innerText.length>300)same++;else{same=0;last=sig}
      }
      window.__fc.text=document.body.innerText;window.__fc.done=true;
    })();
  }
  return window.__fc.done?window.__fc.text:null;
}
var capBusy=false;
function capture(g,u,rep){
  if(!/^https:\/\/(www\.)?basquetcatala\.cat\//i.test(u)){msg="Pega el enlace del partido (empieza por https://www.basquetcatala.cat/).";render();return}
  if(!(window.cordova&&cordova.InAppBrowser)){msg="La captura automática solo funciona en la app instalada. Aquí puedes pegar el texto a mano.";render();return}
  if(capBusy)return;capBusy=true;
  g.url=u;save();
  var ref=cordova.InAppBrowser.open(u,"_blank","location=no,zoom=no,hidenavigationbuttons=yes,closebuttoncaption=Cerrar");
  var alive=true,started=false,t0=Date.now();
  function end(){alive=false;capBusy=false}
  function poll(){
    if(!alive)return;
    ref.executeScript({code:"("+capScript.toString()+")()"},function(r){
      if(!alive)return;
      var t=r&&r[0];
      if(t){end();try{ref.close()}catch(e){}go(g.id);apply(g,t,rep,true)}
      else if(Date.now()-t0<150000)setTimeout(poll,1500);
      else{end();try{ref.close()}catch(e){}msg="No he conseguido leer la página (tiempo agotado).";go(g.id)}
    });
  }
  ref.addEventListener("loadstop",function(){if(started)return;started=true;poll()});
  ref.addEventListener("loaderror",function(){if(alive){end();try{ref.close()}catch(e){}msg="No se pudo cargar la página. Revisa el enlace y la conexión.";go(g.id)}});
  ref.addEventListener("exit",function(){if(alive){end();msg="Captura cancelada.";go(g.id)}});
}
function capGame(rep){
  var g=games.find(function(x){return x.id===cur}),u=document.getElementById("cu").value.trim();
  capture(g,u,rep);
}
function capNew(){
  var u=document.getElementById("hu").value.trim();
  if(!/^https:\/\/(www\.)?basquetcatala\.cat\//i.test(u)){msg="Pega el enlace del partido (empieza por https://www.basquetcatala.cat/).";render();return}
  var g={id:Date.now(),teams:[],abbr:[],roster:{},markers:{},ev:{},updated:null};games.push(g);save();
  capture(g,u,false);
}
render();
restoreNative();
</script>
